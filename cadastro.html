<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tela de cadastro poggers</h1>
    </header>
    <main>
        <form id="formulario">
            <div>
                <h3>Nome:</h3>
                <label for="Nome"></label>
                <input type="text" id="Nome" placeholder="Nome" required>
            </div>
            <div>
                <h3>CPF:</h3>
                <label for="cpf"></label>
                <input type="number" id="cpf" placeholder="000.000.000-00" required>
            </div>
            <div>
                <h3>Endereço:</h3>
                <label for="End"></label>
                <input type="text" id="End" placeholder="Endereço" required>
            </div>
            <div>
                <h3>Email:</h3>
                <label for="email"></label>
                <input type="email" id="email" placeholder="exemplo@gmail.com" required>
            </div>
            <div>
                <h3>Senha:</h3>
                <label for="senha"></label>
                <input type="password" id="senha" placeholder="senha" required>
            </div>
            <button type="submit" id="cadastro">Cadastrar</button> <button onclick="window.location.href='index.html'">Retornar</button>
        </form>


    </main>
    <footer>
        <h4> &copy;2026 Todos os direitos reservados. Marcos e Gustavo</h4>
    </footer>
    <script src="script.js"></script>
</body>
</html>
